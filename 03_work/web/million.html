<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BUILD BURGER 1,000,000</title>
  <style>
    :root {
      --paper: #fff;
      --ink: #000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: "Yu Gothic", "YuGothic", "游ゴシック", "Hiragino Sans", sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
    }

    #ui {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 240px;
      display: grid;
      gap: 12px;
    }

    #ui>section {
      display: grid;
      gap: 4px;
    }

    .label {
      font-weight: 700;
    }

    button {
      font: inherit;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--ink);
      padding: 1px 8px;
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--paper);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--ink);
    }

    .row {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }

    a {
      color: var(--ink);
    }

    #info {
      position: fixed;
      left: 16px;
      bottom: 16px;
    }

    #price {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    #copy {
      position: fixed;
      top: 16px;
      right: 16px;
      writing-mode: vertical-rl;
      font-size: 44px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    #copy[hidden] {
      display: none;
    }

    #hint {
      position: fixed;
      right: 16px;
      bottom: 16px;
      text-align: right;
    }
  </style>
  <script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>

<body>
  <div id="ui">
    <section>
      <div class="label">1層に並べる数</div>
      <input id="width" type="range" min="0" max="1000" step="1">
      <div id="widthValue"></div>
    </section>
    <section>
      <div class="label">積み方</div>
      <div class="row" id="order"></div>
    </section>
    <section>
      <div class="row"><button id="random">ランダム</button><button id="copyToggle">コピー</button></div>
    </section>
    <section>
      <div class="label">仕入れ（全部使う）</div>
      <div id="stock"></div>
    </section>
    <section><a href="./index.html">← ジェネレーター</a></section>
  </div>
  <div id="copy">みんなで<br>百万円のバーガーを<br>食べ尽くそう</div>
  <div id="info">
    <div id="price"></div>
    <div id="spec"></div>
  </div>
  <div id="hint">R：ランダム　C：コピー　ドラッグ：回転　ホイール：拡大<br>マネキンは身長160cm</div>
  <script type="module" src="./million.js"></script>
</body>

</html>
